version: '3.8'

services:
  txt2img:
    build:
      context: .
      dockerfile: Dockerfile
    image: txt2img:latest
    container_name: txt2img-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=256
    # 機密 (AWS 金鑰等) 放在伺服器上的 .env.local, 不會打包進映像檔
    env_file:
      - .env.local
