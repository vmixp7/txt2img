name: Deploy txt2img

on:
  workflow_dispatch:
  push:
    branches: [ "release" ]

env:
  EC2_USER: ubuntu
  EC2_HOST: ec2-43-202-225-47.ap-northeast-2.compute.amazonaws.com
  EC2_DIR: /home/ubuntu/txt2img
  SSH_KEY_PATH: ~/.ssh/ten_color.pem

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Verify SSH key secret
      run: |
        if [ -z "${{ secrets.TEST_SECRET }}" ]; then
          echo "❌ Secret TEN_COLOR_PEM is empty!"
          exit 1
        else
          # 顯示前 10 個字元和長度驗證
          echo "✅ Secret TEST_SECRET is set"
          echo "First 10 chars: ${ { secrets.TEST_SECRET } :0:10 }"
          echo "Length: $(echo "${{ secrets.TEST_SECRET }}" | wc -c) characters"
        fi

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install SSH client
      run: sudo apt-get update && sudo apt-get install -y ssh rsync

    - name: Save SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.TEN_COLOR_PEM }}" > ${{ env.SSH_KEY_PATH }}
        chmod 600 ${{ env.SSH_KEY_PATH }}

    - name: Upload project files to EC2
      run: |
        rsync -avz --delete --exclude='.git' -e "ssh -o StrictHostKeyChecking=no -i ${{ env.SSH_KEY_PATH }}" \
        ./ ${{ env.EC2_USER }}@${{ env.EC2_HOST }}:${{ env.EC2_DIR }}/

    - name: SSH and run deploy script
      run: |
        ssh -o StrictHostKeyChecking=no -i ${{ env.SSH_KEY_PATH }} \
        ${{ env.EC2_USER }}@${{ env.EC2_HOST }} \
        "cd ${{ env.EC2_DIR }} && chmod +x deploy.sh && ./deploy.sh"
